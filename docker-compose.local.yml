# Entorno local de referencia (forma "oficial" para el equipo, ver prompt §10).
#
# NOTA para quien retome esto: en la sesion en que se construyo este esqueleto, el sandbox de
# ejecucion no tenia Docker disponible. Para poder probar el flujo end-to-end de todas formas,
# se uso `dynalite` (implementacion pura JS de la API de DynamoDB, sin Docker/Java) via
# `npm run local:up` / `npm run local:down` (ver scripts/local-dynamo-up.ts). Ambos hablan el
# mismo protocolo AWS SDK DynamoDB, asi que el resto del proyecto (BaseRepository, scripts de
# seed/create-tables) funciona igual con cualquiera de los dos. Si tienes Docker disponible,
# usa este docker-compose (mas fiel a producción real, dynamodb-local es el binario oficial de AWS).
#
# No se incluye una cola SQS FIFO local (ElasticMQ): para el MVP se eligio una cola en memoria
# (src/local/in-memory-queue.ts), documentado en CLAUDE.md — evita una dependencia de infra
# adicional para un flujo que en local se ejecuta de forma sincronica/secuencial de todas formas.
version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    # `-dbPath` (y NO `-inMemory`): la base tiene que sobrevivir a un reinicio. En memoria se
    # pierden los items `CONVERSATION#<id> META`, que ligan el conversation_id del webhook
    # post-call con nuestro followup_id — y sin ese enlace el resultado de una llamada ya
    # hecha es irrecuperable (ver UV-056). El camino sin Docker (`npm run local:up`, dynalite)
    # persiste en el mismo directorio, para que los dos se comporten igual.
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data'
    ports:
      - '8000:8000'
    working_dir: /home/dynamodblocal
    volumes:
      - ./.dynamo-local-data:/home/dynamodblocal/data
